<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
    <title>연습04</title>
    
    <style>
    * {
        font-family: "Bagel Fat One", system-ui;
        font-weight: 400;
        font-style: normal;
    }

    h1 { 
        text-align: center;
    }

    body {
        margin: 0px auto;
        width: 500px;
    }

    form {
        border: 3px dotted rgb(255, 208, 208);
        padding: 20px;
    }

    span {
        display: inline-block;
        width: 100px;
        background-color: rgba(254, 184, 255, 0.522);
        padding: 2px;
        margin: 2px;
        text-align: center;

    }
    input[type='text'], input[type='password'], select{
        border: 1px solid blue;
        padding: 2px;
        border-radius: 3px;
    }

    input[type='text']:focus{
        background-color: pink;
    }
    
    .buttons{
        text-align: center;
        margin-top: 20px;
    }

    input[type="submit"],[type="reset"] {
        cursor: pointer;
        background-color: pink;
        border: none;
        padding: 5px 20px;
        border-radius: 5px;
    }
    

    </style>
</head>
<body>
    <h1>회원가입</h1>
    <form action="">
    <div>
        <span>아이디:</span><input type="text">
    </div>

    <div>
        <span>비밀번호:</span><input type="password">
    </div>

    <div>
        <span>직업:</span>
        <select name="" id="">
            <option>프로그래머</option>
            <option>의사</option>
            <option>변호사</option>
            <option>기타</option>
        </select>
    </div>

    <div>
        <span>성별:</span>
        <input type="radio" name="gender">남
        <input type="radio" name="gender">여
    </div>

    <div>
        <span>취미:</span>
        <input type="checkbox">골프
        <input type="checkbox">컴퓨터게임
        <input type="checkbox">독서
        <input type="checkbox">영화감상

    </div>

    <div class="buttons">
        <input type="submit" value="회원가입">
        <input type="reset" value="가입취소">
    </div>
    </form>
</body>
</html>
