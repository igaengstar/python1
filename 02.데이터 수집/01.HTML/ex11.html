<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 구글 폰트(Jua) 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <!-- jQuery (AJAX, DOM 조작 등 사용) -->
    <script src="http://code.jquery.com/jquery-1.9.1.js"></script>

    <!-- Bootstrap CSS (디자인용) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS (버튼, 모달 등 기능 제공) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Handlebars.js (템플릿 엔진: 데이터 → HTML 변환) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/3.0.1/handlebars.js"></script>        

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서검색</title>

    <style>
        /* 전체 폰트 적용 */
        * {
            font-family: "Jua", sans-serif;
        }
        /* 그림자 효과 */
        .box {
            box-shadow: 5px 5px 5px gray;
        }
    </style>    
</head>
<body>
    <div class="container p-5">
        <!-- 제목 -->
        <h1 class="text-center mb-5">도서검색</h1>

        <!-- 검색 폼 -->
        <div>
            <form name="frm">
                <input placeholder="검색어" name="query">
                <button class="btn btn-primary btn-sm">검색</button>
            </form>
        </div>

        <hr>

        <!-- 검색 결과가 들어갈 영역 -->
        <div id="books" class="row"></div>

        <!-- Handlebars 템플릿 -->
        <script id="temp" type="x-handlebars-template">
            {{#each documents}} <!-- documents 배열 반복 -->
                <div class="col-6 col-md-3 col-lg-2 mb-2 box p-2">
                    <a href="{{url}}"> <!-- 책 상세페이지 링크 -->
                        <img src="{{thumbnail}}" width="100%"> <!-- 책 표지 -->
                    </a>    
                    <div class="text-truncate">{{title}}</div> <!-- 책 제목 -->
                    <div>{{sale_price}}원</div> <!-- 책 가격 -->
                </div>    
            {{/each}}
        </script>
    </div>
</body>
<script>
    // 기본 검색 값 설정
    const page = 1;            // 페이지 번호
    let query = '파이썬';       // 기본 검색어
    const size = 12;           // 한 페이지에 보여줄 개수

    // 검색 폼 이벤트 처리
    $(frm).on("submit", function(event){
        event.preventDefault();  // 폼의 기본 동작(새로고침) 막기
        query = $(frm.query).val(); // 입력된 검색어 가져오기

        if(query == ''){ // 입력이 없으면 경고창
            alert('검색을 입력하세요!');
        }else{
            getBooks(); // 검색 실행
        }
    })

    // 도서 검색 함수
    function getBooks(){
        $.ajax({
            type: 'get', // 요청 방식
            url: 'https://dapi.kakao.com/v3/search/book', // 카카오 책 검색 API
            dataType: 'json', // 응답 데이터 형식
            headers: {
                // 인증 키 (발급받은 카카오 REST API 키 사용)
                'Authorization': 'KakaoAK 4a8e1acc493134e630bb6e1dd8deb6eb'
            },
            // API 요청에 보낼 데이터
            data: {page, query, size},

            // 요청 성공 시 실행
            success: function(data){
                console.log(data); // 받아온 데이터 확인

                // 1. 템플릿 가져와서 컴파일
                temp = Handlebars.compile($("#temp").html());

                // 2. 템플릿에 실제 데이터 넣기
                temp_data = temp(data);

                // 3. 완성된 HTML을 books 영역에 삽입
                $("#books").html(temp_data);
            }
        });
    }

    // 페이지 로드 시 기본 검색 실행
    getBooks()
</script>
</html>
